<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>강원도 가족 여행 2026</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="styles.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>

    <!-- Main App Container -->
    <div id="app" class="app-container">
        <!-- Sticky Header -->
        <header class="app-header">
            <!-- Top bar: label and icons -->
            <div class="header-icon-bar">
                <div class="trip-label">2026</div>
                <div class="icon-group">
                    <button id="btn-theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                        <svg id="icon-moon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                        <svg id="icon-sun" class="hidden" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    </button>
                    <button id="btn-admin-toggle" class="icon-btn" aria-label="Admin Login">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </button>
                </div>
            </div>
            <!-- Trip Identity Block -->
            <div class="header-identity">
                <div class="header-identity-left">
                    <h1 class="trip-title">강원도 가족여행</h1>
                    <div class="trip-dates-row">
                        <span>2026.08.14 ~ 08.16 · 2박 3일</span>
                    </div>
                    <div class="trip-route-row">
                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none" style="color:var(--primary-color)"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <span>양양</span>
                        <span class="route-arrow">→</span>
                        <span>속초</span>
                        <span class="route-arrow">→</span>
                        <span>고성</span>
                    </div>
                </div>
                <div class="header-identity-right">
                    <div id="trip-status-badge" class="trip-dday-block">
                        <span class="dday-label">D-DAY</span>
                        <span class="dday-number">?</span>
                    </div>
                </div>
            </div>
            <!-- Grouped Nav Block for Tabs -->
            <div class="header-nav-block">
                <!-- Day Tabs -->
                <div id="day-tabs" class="day-tabs"></div>
                <!-- Feature Tabs -->
                <div class="tabs-wrapper">
                    <nav class="tabs">
                        <button class="tab-btn active" data-target="timeline">일정</button>
                        <button class="tab-btn" data-target="map">지도</button>
                        <button class="tab-btn" data-target="rooms">숙소</button>
                        <button class="tab-btn" data-target="expenses">경비</button>
                    </nav>
                </div>
            </div>
        </header>

        <main class="content-area">
            <!-- Views -->
            <div id="view-timeline" class="view-section active">
                <div class="timeline-container" id="timeline-container">
                    <!-- Cards will be dynamically injected here -->
                </div>
                <button id="btn-add-schedule" class="fab ripple hidden" aria-label="일정 추가">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>

            <div id="view-map" class="view-section hidden">
                <div class="glass-panel map-wrapper">
                    <div id="map-container"></div>
                </div>
            </div>

            <div id="view-rooms" class="view-section hidden">
                <div id="rooms-container">
                    <!-- Room cards injected via JS -->
                </div>
            </div>

            <div id="view-expenses" class="view-section hidden">
                <div class="expenses-header glass-panel">
                    <h3 id="expense-day-title">1일차 경비</h3>
                    <div class="total-amount" id="day-expense">₩0</div>
                    <div style="margin-top: 8px; font-size: 0.9rem; color: var(--text-muted);">총 여행 경비: <span id="total-expense" style="font-weight: 600; color: var(--text-main);">₩0</span></div>
                </div>
                <div class="expense-list-container">
                    <ul id="expense-list" class="expense-list">
                        <!-- Expense items will be dynamically injected here -->
                    </ul>
                </div>
                <button id="btn-add-expense" class="fab ripple" aria-label="경비 추가">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>

        </main>
    </div>

    <!-- Admin/Action Modals -->
    <div id="admin-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <h3 style="margin-bottom: 8px;">관리자 로그인</h3>
            <p style="margin-bottom: 16px; font-size: 0.85rem; color: var(--text-muted);">일정 수정 및 항목 삭제를 위해 암호를 입력하세요. (비밀번호: <strong>1111</strong>)</p>
            <input type="password" id="admin-pin" class="pin-input" inputmode="numeric" maxlength="4" placeholder="****">
            <div class="modal-actions">
                <button class="btn-text btn-cancel">취소</button>
                <button id="btn-admin-login" class="btn-primary">확인</button>
            </div>
        </div>
    </div>

    <!-- Schedule Edit Modal -->
    <div id="schedule-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <h2 id="schedule-modal-title">일정 추가</h2>
            <form id="schedule-form">
                <div class="form-group">
                    <label>시간</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <select id="schedule-time-hour" style="flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--surface-color); color: var(--text-main); font-size: 1.1rem; appearance: none; text-align: center;">
                            <!-- Populated via JS -->
                        </select>
                        <span style="font-weight: 800;">:</span>
                        <select id="schedule-time-minute" style="flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--surface-color); color: var(--text-main); font-size: 1.1rem; appearance: none; text-align: center;">
                            <!-- Populated via JS -->
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>장소/일정명</label>
                    <input type="text" id="schedule-title" required placeholder="예: 속초해수욕장">
                </div>
                <div class="form-group">
                    <label>장소 위치 검색 (선택 - 지도 연동용)</label>
                    <div style="display: flex; gap: 8px; margin-bottom: 4px;">
                        <input type="text" id="schedule-search" placeholder="장소명 또는 주소 검색" style="flex: 1; min-width: 0; margin-bottom: 0;">
                        <button type="button" id="btn-search-place" class="btn-primary" style="flex: 0 0 80px; margin-bottom: 0; padding: 0;">검색</button>
                    </div>
                    <ul id="search-results" class="search-results hidden"></ul>
                    <input type="hidden" id="schedule-lat">
                    <input type="hidden" id="schedule-lng">
                </div>
                <div class="form-group">
                    <label>간단 소개 (선택)</label>
                    <textarea id="schedule-intro" rows="2" placeholder="예: 푸른 바다를 보며 힐링"></textarea>
                </div>
                <div class="form-group">
                    <label>메모/팁 (선택)</label>
                    <textarea id="schedule-memo" rows="2" placeholder="예: 주차장 제1공영 이용"></textarea>
                </div>
                <div class="form-group">
                    <label>유형 (선택)</label>
                    <select id="schedule-type">
                        <option value="">선택 안 함</option>
                        <option value="place">명소/관광지</option>
                        <option value="food">식당</option>
                        <option value="cafe">카페</option>
                        <option value="mart">마트/쇼핑</option>
                        <option value="accom">숙소</option>
                        <option value="transit">이동/기타</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-text btn-cancel-schedule">취소</button>
                    <button type="submit" class="btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Expense Modal -->
    <div id="expense-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <h3 id="expense-modal-title">경비 추가</h3>
            <form id="expense-form">
                <div class="form-group">
                    <label>카테고리</label>
                    <select id="expense-category" required>
                        <option value="식비">식비</option>
                        <option value="숙소">숙소</option>
                        <option value="카페">카페</option>
                        <option value="마트">마트</option>
                        <option value="주유">주유</option>
                        <option value="입장료">입장료</option>
                        <option value="기타">기타</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>내용</label>
                    <input type="text" id="expense-memo" placeholder="예: 흥부네밥상 점심" required>
                </div>
                <div class="form-group">
                    <label>금액</label>
                    <input type="number" id="expense-amount" placeholder="예: 50000" inputmode="numeric" required>
                </div>
                <div class="form-group">
                    <label>결제자 (선택)</label>
                    <input type="text" id="expense-author" placeholder="예: 아빠">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-text btn-cancel-expense">취소</button>
                    <button type="submit" class="btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Room Edit Modal -->
    <div id="room-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <h2 id="room-modal-title">객실 정보 수정</h2>
            <form id="room-form">
                <input type="hidden" id="room-day">
                <div class="form-group">
                    <label>숙소명</label>
                    <input type="text" id="room-name" required placeholder="예: 양양쏠비치">
                </div>
                <div class="form-group">
                    <label>룸형태</label>
                    <input type="text" id="room-type" placeholder="예: 스위트 오션뷰">
                </div>
                <div class="form-group">
                    <label>배정호실</label>
                    <input type="text" id="room-number" placeholder="예: A동 302호">
                </div>
                <div class="form-group">
                    <label>출입방법 (비밀번호 등)</label>
                    <input type="text" id="room-entry" placeholder="예: 1234* 또는 카드키">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-text btn-cancel-room">취소</button>
                    <button type="submit" class="btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
